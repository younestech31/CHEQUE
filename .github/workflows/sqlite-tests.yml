name: SQLite financial guardrails

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sqlite-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test core financial rules
        run: python scripts/test_schema.py
      - name: Test cheque and treasury workflow
        run: python scripts/test_workflow.py
